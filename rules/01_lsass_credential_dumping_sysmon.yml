title: LSASS Memory Access from Non-System Process (Sysmon 10)
id: a1b2c3d4-0000-4000-8000-000000000001
status: test
description: Detects a process opening a handle to lsass.exe with access rights commonly used for credential dumping.
  Sysmon Event ID 10 (ProcessAccess) targeting lsass.exe from a non-system process is a strong indicator of LSASS
  credential theft (ATT&CK T1003.001).
references:
- https://attack.mitre.org/techniques/T1003/001/
author: Gilberto A. Cedillo Soto
date: '2026-10-23'
tags:
- attack.credential_access
- attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
    - '0x1010'
    - '0x1410'
    - '0x147a'
    - '0x143a'
    - '0x1fffff'
  filter_system:
    SourceImage|endswith:
    - \MsMpEng.exe
    - \csrss.exe
    - \wininit.exe
    - \services.exe
  condition: selection and not filter_system
falsepositives:
- Antivirus or EDR legitimately opening LSASS during scans
- Authorized credential-theft simulations (red team)
level: high
