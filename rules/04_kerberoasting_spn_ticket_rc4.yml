title: Kerberoasting - Service Ticket Request with RC4 Encryption (4769)
id: a1b2c3d4-0000-4000-8000-000000000004
status: test
description: Detects Kerberos service ticket requests (Event ID 4769) using weak RC4 encryption (TicketEncryptionType
  0x17) against SPN-bearing service accounts. Attackers request these tickets to crack service account passwords
  offline (T1558.003). Aggregation threshold is applied in the SIEM queries.
references:
- https://attack.mitre.org/techniques/T1558/003/
author: Gilberto A. Cedillo Soto
date: '2026-10-23'
tags:
- attack.credential_access
- attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
    ServiceName|endswith:
    - MSSQLSvc
    - HTTP
    - WSMAN
    - LDAP
  filter_dc:
    IpAddress:
    - ::1
    - 127.0.0.1
  condition: selection and not filter_dc
falsepositives:
- Legacy applications that only support RC4 Kerberos encryption
- Misconfigured service accounts on old SQL Server instances
level: medium
